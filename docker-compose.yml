version: '3.8'

services:
  sunmi-printer-simulator:
    image: sunmi-printer-simulator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunmi-printer-simulator
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
